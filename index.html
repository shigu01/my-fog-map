<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>白地図アプリ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="白地図アプリ">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
}

#map-container{
  position:relative;
  width:100%;
  height:100%;
}

#map{
  width:100%;
  height:100%;
}

#app-version{
  position:absolute;
  bottom:6px;
  left:8px;
  z-index:1001;
  padding:2px 5px;
  border-radius:4px;
  background:rgba(255,255,255,.78);
  color:#666;
  font-size:9px;
  font-family:sans-serif;
  line-height:1.2;
  pointer-events:none;
  user-select:none;
}

#fog-canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:500;
  pointer-events:none;
}

#controls{
  position:absolute;
  top:12px;
  left:12px;
  z-index:1000;
  background:rgba(255,255,255,.92);
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
  color:#333;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  gap:5px;
}

#status{
  font-size:10px;
  color:#555;
  font-weight:normal;
  max-width:180px;
  word-wrap:break-word;
}

.control-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  font-size:11px;
  color:#444;
}

.control-row input[type="range"]{
  width:80px;
  cursor:pointer;
}

.switch-label{
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
}

.wakelock-status{
  font-size:9px;
  padding:1px 4px;
  border-radius:3px;
  font-weight:bold;
}

.status-on{
  background:#e3f9e5;
  color:#1f9d55;
}

.status-off{
  background:#f1f3f5;
  color:#868e96;
}

#reload-treasure-btn{
  margin-top:2px;
  padding:4px 8px;
  font-size:10px;
  background:#3498db;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

#reload-treasure-btn:active{
  background:#2980b9;
}

#locate-btn{
  position:absolute;
  bottom:24px;
  right:24px;
  z-index:1000;
  background:#fff;
  border:none;
  border-radius:50%;
  width:48px;
  height:48px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

#locate-btn:active{
  transform:scale(.92);
  background:#f0f0f0;
}

.treasure-marker{
  font-size:26px;
  text-align:center;
  line-height:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  pointer-events:auto;
  cursor:pointer;
}

.treasure-marker.opened{
  font-size:20px;
  opacity:.7;
}

.user-location-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#e74c3c;
  border:2px solid #fff;
  box-shadow:0 0 2px rgba(0,0,0,.5);
  box-sizing:border-box;
}

#notification{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
  display:none;
  pointer-events:none;
  white-space:nowrap;
}
</style>
</head>

<body>
<div id="map-container">

<div id="notification"></div>

<div id="controls">

<div id="status">位置情報を取得中...</div>

<div class="control-row">
<label for="opacity-slider">
霧の濃さ:
<span id="opacity-val">100%</span>
</label>
<input type="range" id="opacity-slider" min="50" max="100" value="100">
</div>

<div class="control-row">
<span>画面常時点灯:</span>
<label class="switch-label">
<input type="checkbox" id="wakelock-toggle">
<span id="wakelock-badge" class="wakelock-status status-off">OFF</span>
</label>
</div>

<div
class="control-row"
style="border-top:1px solid #ddd;padding-top:4px;margin-top:2px;"
>
<span>累計獲得宝箱:</span>
<span id="treasure-count" style="font-weight:bold;color:#d35400;">
🎁 0個
</span>
</div>

<div class="control-row">
<span>ジェム:</span>
<span id="gem-count" style="font-weight:bold;color:#6c5ce7;">
💎 0個
</span>
</div>

<button id="reload-treasure-btn">
🔍 周辺の宝箱を検索
</button>

<div style="font-size:9px;color:#777;line-height:1.35;">
※ 宝箱の近くでマークをタップして開けます
</div>

<div
id="treasure-debug"
style="font-size:9px;color:#888;line-height:1.35;"
>
宝箱データ: 0 / 表示中: 0
</div>

</div>

<div id="map"></div>

<canvas id="fog-canvas"></canvas>

<div id="app-version">v1.1.4</div>

<button id="locate-btn" title="現在地に移動">🎯</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<script>
const STORAGE_KEY_POINTS='fog_visited_points';
const STORAGE_KEY_OPACITY='fog_opacity_value';
const STORAGE_KEY_TREASURES='fog_treasures_data';
const STORAGE_KEY_GEMS='fog_gems';
const STORAGE_KEY_OPENED_TREASURES='fog_opened_treasure_count';

const UNFOG_RADIUS_METERS=50;
const MIN_RECORD_DISTANCE_METERS=5;

const TREASURE_GET_RADIUS_METERS=25;
const TREASURE_TAP_MAX_ACCURACY_METERS=20;
const TREASURE_TAP_POSITION_MAX_AGE_MS=10000;

const REFETCH_TREASURE_DISTANCE=300;

const TREASURE_SEARCH_RADIUS_METERS=400;
const TREASURE_SEARCH_BOUNDARY_BUFFER_METERS=60;

const TREASURE_ALGORITHM_VERSION='dead-end-v6';

const APP_VERSION='v1.1.4';

const NEAR_OTHER_WAY_METERS=6;

/*
 * 宝箱データは全件保存する。
 * ただし、Leafletに同時に生成するDOM Markerは
 * 現在の地図周辺だけに限定する。
 */
const TREASURE_RENDER_PADDING=0.15;
const MAX_VISIBLE_TREASURE_MARKERS=250;

const OVERPASS_ENDPOINTS=[
'https://overpass-api.de/api/interpreter',
'https://overpass.kumi.systems/api/interpreter',
'https://overpass.private.coffee/api/interpreter'
];

let visitedPoints=[];
let treasureList=[];

let gemCount=0;
let openedTreasureCount=0;

let treasureMarkers={};

let isFetchingTreasures=false;
let lastFetchedLatLng=null;

let fogOpacity=1.0;

let currentLatLng=null;
let userMarker=null;

let currentAccuracy=null;
let currentPositionTimestamp=null;

let wakeLock=null;
let watchId=null;

let isRenderPending=false;


/* =========================
   霧用グラデーション
========================= */

const STAMP_SIZE=128;

const stampCanvas=document.createElement('canvas');
stampCanvas.width=STAMP_SIZE;
stampCanvas.height=STAMP_SIZE;

const stampCtx=stampCanvas.getContext('2d');

const grad=stampCtx.createRadialGradient(
STAMP_SIZE/2,
STAMP_SIZE/2,
(STAMP_SIZE/2)*0.4,
STAMP_SIZE/2,
STAMP_SIZE/2,
STAMP_SIZE/2
);

grad.addColorStop(0,'rgba(0,0,0,1)');
grad.addColorStop(1,'rgba(0,0,0,0)');

stampCtx.fillStyle=grad;
stampCtx.beginPath();
stampCtx.arc(
STAMP_SIZE/2,
STAMP_SIZE/2,
STAMP_SIZE/2,
0,
Math.PI*2
);
stampCtx.fill();


/* =========================
   保存データ復元
========================= */

function loadSavedData(){

const savedPoints=
localStorage.getItem(STORAGE_KEY_POINTS);

if(savedPoints){
try{
visitedPoints=JSON.parse(savedPoints);
}catch(e){
visitedPoints=[];
}
}

const savedOpacity=
localStorage.getItem(STORAGE_KEY_OPACITY);

if(savedOpacity){

fogOpacity=
parseFloat(savedOpacity)/100;

document.getElementById('opacity-slider').value=
savedOpacity;

document.getElementById('opacity-val').innerText=
`${savedOpacity}%`;

}

const savedGemCount=
localStorage.getItem(STORAGE_KEY_GEMS);

if(savedGemCount!==null){

const parsedGems=
parseInt(savedGemCount,10);

gemCount=
Number.isFinite(parsedGems)&&parsedGems>=0
?parsedGems
:0;

}

const savedOpenedTreasureCount=
localStorage.getItem(STORAGE_KEY_OPENED_TREASURES);

if(savedOpenedTreasureCount!==null){

const parsedOpened=
parseInt(savedOpenedTreasureCount,10);

openedTreasureCount=
Number.isFinite(parsedOpened)&&parsedOpened>=0
?parsedOpened
:0;

}

const savedTreasureAlgorithmVersion=
localStorage.getItem(
'fog_treasure_algorithm_version'
);

const savedTreasures=
localStorage.getItem(
STORAGE_KEY_TREASURES
);

/*
 * 宝箱配置アルゴリズムが変わった場合のみ、
 * 古い宝箱データをリセットする。
 */
if(
savedTreasureAlgorithmVersion!==
TREASURE_ALGORITHM_VERSION
){

treasureList=[];

localStorage.removeItem(
STORAGE_KEY_TREASURES
);

localStorage.setItem(
'fog_treasure_algorithm_version',
TREASURE_ALGORITHM_VERSION
);

}else if(savedTreasures){

try{

const parsed=
JSON.parse(savedTreasures);

treasureList=
parsed.filter(
t=>
typeof t.lat==='number'&&
typeof t.lng==='number'&&
!isNaN(t.lat)&&
!isNaN(t.lng)
);

}catch(e){

treasureList=[];

}

}

if(savedOpenedTreasureCount===null){

openedTreasureCount=
treasureList.filter(
t=>t.opened
).length;

localStorage.setItem(
STORAGE_KEY_OPENED_TREASURES,
String(openedTreasureCount)
);

}

}

loadSavedData();


/* =========================
   地図
========================= */

const map=L.map(
'map',
{
zoomControl:false,
rotate:true,
touchRotate:true,
rotateControl:{
position:'topright',
closeOnZeroBearing:false
},
bearing:0
}
).setView(
[35.6812,139.7671],
17
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'&copy; OpenStreetMap'
}
).addTo(map);


/* =========================
   Leaflet Pane
========================= */

map.createPane('treasurePane');
map.getPane('treasurePane').style.zIndex=600;

map.createPane('userPane');
map.getPane('userPane').style.zIndex=700;


/* =========================
   霧Canvas
========================= */

const canvas=
document.getElementById('fog-canvas');

document
.getElementById('map-container')
.appendChild(canvas);

const ctx=canvas.getContext('2d');

function resizeCanvas(){
requestDrawFog();
}

window.addEventListener(
'resize',
resizeCanvas
);


/* =========================
   霧描画
========================= */

function drawFog(){

const size=map.getSize();

if(size.x===0||size.y===0)return;

if(
canvas.width!==size.x||
canvas.height!==size.y
){

canvas.width=size.x;
canvas.height=size.y;

canvas.style.width=
size.x+'px';

canvas.style.height=
size.y+'px';

}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle=
`rgba(255,255,255,${fogOpacity})`;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.globalCompositeOperation=
'destination-out';

const bounds=
map.getBounds().pad(0.2);

for(
let i=0;
i<visitedPoints.length;
i++
){

const point=
visitedPoints[i];

if(
!bounds.contains(
[
point.lat,
point.lng
]
)
)continue;

const containerPoint=
map.latLngToContainerPoint(
[
point.lat,
point.lng
]
);

const edgeLatLng=
L.latLng(
point.lat,
point.lng+
(
point.radius/
111320
)
);

const edgePoint=
map.latLngToContainerPoint(
edgeLatLng
);

const pixelRadius=
Math.max(
15,
Math.abs(
edgePoint.x-
containerPoint.x
)
);

const diameter=
pixelRadius*2;

ctx.drawImage(
stampCanvas,
containerPoint.x-pixelRadius,
containerPoint.y-pixelRadius,
diameter,
diameter
);

}

ctx.globalCompositeOperation=
'source-over';

}

function requestDrawFog(){

if(!isRenderPending){

isRenderPending=true;

requestAnimationFrame(
()=>{
drawFog();
isRenderPending=false;
}
);

}

}

map.on(
'move zoom rotate viewreset resize load',
requestDrawFog
);

map.whenReady(
()=>requestDrawFog()
);

map.on(
'tileload tileloadstart',
()=>requestDrawFog()
);

requestDrawFog();


/* =========================
   現在地マーカー
========================= */

function updateUserMarker(){

if(!currentLatLng)return;

if(!userMarker){

const dotIcon=
L.divIcon({
className:'',
html:'<div class="user-location-dot"></div>',
iconSize:[16,16],
iconAnchor:[8,8]
});

userMarker=
L.marker(
currentLatLng,
{
icon:dotIcon,
pane:'userPane',
interactive:false
}
).addTo(map);

}else{

userMarker.setLatLng(
currentLatLng
);

}

}

if(visitedPoints.length>0){

const last=
visitedPoints[
visitedPoints.length-1
];

map.setView(
[
last.lat,
last.lng
],
17
);

}


/* =========================
   宝箱ID
========================= */

function createTreasureId(
lat,
lng
){

const latKey=
Math.round(lat*1000000);

const lngKey=
Math.round(lng*1000000);

return `tr_${latKey}_${lngKey}`;

}


/* =========================
   宝箱表示
========================= */

function renderTreasures(){

/*
 * 全宝箱データをそのままMarker化しない。
 * 現在の地図表示範囲周辺だけを対象にする。
 */

const bounds=
map
.getBounds()
.pad(
TREASURE_RENDER_PADDING
);

const center=
map.getCenter();

let visibleTreasures=
treasureList.filter(
t=>
Number.isFinite(t.lat)&&
Number.isFinite(t.lng)&&
bounds.contains(
[
t.lat,
t.lng
]
)
);


/*
 * ズームアウトなどで表示候補が
 * 250個を超えた場合は、
 * 地図中心に近い宝箱を優先する。
 */

if(
visibleTreasures.length>
MAX_VISIBLE_TREASURE_MARKERS
){

visibleTreasures.sort(
(a,b)=>{

const da=
calculateDistance(
center.lat,
center.lng,
a.lat,
a.lng
);

const db=
calculateDistance(
center.lat,
center.lng,
b.lat,
b.lng
);

return da-db;

}
);

visibleTreasures=
visibleTreasures.slice(
0,
MAX_VISIBLE_TREASURE_MARKERS
);

}

const visibleIds=
new Set(
visibleTreasures.map(
t=>t.id
)
);


/*
 * 画面外になったMarkerを削除。
 *
 * データは削除しない。
 */
Object.keys(
treasureMarkers
).forEach(
id=>{

if(!visibleIds.has(id)){

const marker=
treasureMarkers[id];

if(
map.hasLayer(marker)
){

map.removeLayer(marker);

}

delete treasureMarkers[id];

}

}
);


/*
 * 現在の地図周辺だけMarker生成
 */
visibleTreasures.forEach(
t=>{

const iconSymbol=
t.opened
?'✅'
:'🎁';

if(
treasureMarkers[t.id]
){

const marker=
treasureMarkers[t.id];

if(!map.hasLayer(marker)){

marker.addTo(map);

}

const el=
marker.getElement();

if(el){

el.innerHTML=
iconSymbol;

el.classList.toggle(
'opened',
!!t.opened
);

}

return;

}

const customIcon=
L.divIcon({

className:
`treasure-marker ${
t.opened?'opened':''
}`,

html:
iconSymbol,

iconSize:
[30,30],

iconAnchor:
[15,15]

});

const marker=
L.marker(
[
t.lat,
t.lng
],
{
icon:customIcon,
pane:'treasurePane'
}
).addTo(map);

treasureMarkers[t.id]=
marker;

marker.on(
'click',
()=>{
tryOpenTreasure(t.id);
}
);

}
);


updateTreasureUI();


const debug=
document.getElementById(
'treasure-debug'
);

if(debug){

const visibleMarkerCount=
Object.keys(
treasureMarkers
).filter(
id=>
treasureMarkers[id]&&
map.hasLayer(
treasureMarkers[id]
)
).length;

debug.innerText=
`宝箱データ: ${treasureList.length} / 表示中: ${visibleMarkerCount}`;

}

requestDrawFog();

}


/*
 * 地図操作が終わったら、
 * 現在の表示範囲に合わせて
 * 宝箱Markerを更新。
 */
map.on(
'moveend zoomend rotateend viewreset',
renderTreasures
);


/* =========================
   宝箱UI
========================= */

function updateTreasureUI(){

document.getElementById(
'treasure-count'
).innerText=
`🎁 ${openedTreasureCount}個`;

const gemElement=
document.getElementById(
'gem-count'
);

if(gemElement){

gemElement.innerText=
`💎 ${gemCount}個`;

}

}


/* =========================
   宝箱検索
========================= */

async function fetchDeadEndTreasures(
lat,
lng
){

if(isFetchingTreasures)return;

isFetchingTreasures=true;

showNotification(
'🔍 周辺の宝箱を検索中...'
);

const radius=
TREASURE_SEARCH_RADIUS_METERS;

const query=`
[out:json][timeout:15];
(
way[
"highway"~"residential|service|footway|path|living_street"
](
around:${radius},
${lat},
${lng}
);
);
out body;
>;
out skel qt;
`;

let data=null;

for(
const endpoint
of OVERPASS_ENDPOINTS
){

try{

const res=
await fetch(
endpoint,
{
method:'POST',
headers:{
'Content-Type':
'application/x-www-form-urlencoded'
},
body:
'data='+
encodeURIComponent(query)
}
);

if(res.ok){

data=
await res.json();

break;

}

}catch(e){

console.warn(
`Endpoint ${endpoint} failed, trying next...`
);

}

}

if(
!data||
!data.elements
){

console.warn(
'道路データを取得できなかったため、今回は宝箱を追加しません'
);

showNotification(
'⚠️ 道路データを取得できなかったため、宝箱を追加できませんでした'
);

isFetchingTreasures=false;

return;

}

try{

const nodes={};
const ways=[];

data.elements.forEach(
el=>{

if(
el.type==='node'&&
Number.isFinite(el.lat)&&
Number.isFinite(el.lon)
){

nodes[el.id]={
lat:el.lat,
lng:el.lon
};

}

}
);

data.elements.forEach(
el=>{

if(
el.type==='way'&&
Array.isArray(el.nodes)&&
el.nodes.length>=2
){

const validNodes=
el.nodes.filter(
id=>nodes[id]
);

if(
validNodes.length>=2
){

ways.push(
validNodes
);

}

}

}
);


/* =========================
   道路クラスタ
========================= */

const CLUSTER_RADIUS_METERS=4;

const clusterList=[];
const nodeToCluster={};

for(
const [id,node]
of Object.entries(nodes)
){

let assigned=-1;

for(
let i=0;
i<clusterList.length;
i++
){

if(
calculateDistance(
node.lat,
node.lng,
clusterList[i].lat,
clusterList[i].lng
)<=
CLUSTER_RADIUS_METERS
){

assigned=i;
break;

}

}

if(assigned===-1){

assigned=
clusterList.length;

clusterList.push({
lat:node.lat,
lng:node.lng,
members:[]
});

}

clusterList[
assigned
].members.push(id);

const members=
clusterList[
assigned
].members;

let sumLat=0;
let sumLng=0;

for(
const memberId
of members
){

sumLat+=
nodes[memberId].lat;

sumLng+=
nodes[memberId].lng;

}

clusterList[
assigned
].lat=
sumLat/members.length;

clusterList[
assigned
].lng=
sumLng/members.length;

nodeToCluster[id]=
assigned;

}


/* =========================
   クラスタ接続
========================= */

const clusterAdjacency=
clusterList.map(
()=>new Set()
);

for(
const way
of ways
){

for(
let i=0;
i<way.length-1;
i++
){

const aCluster=
nodeToCluster[
way[i]
];

const bCluster=
nodeToCluster[
way[i+1]
];

if(
aCluster===undefined||
bCluster===undefined||
aCluster===bCluster
){

continue;

}

clusterAdjacency[
aCluster
].add(
bCluster
);

clusterAdjacency[
bCluster
].add(
aCluster
);

}

}

const searchRadius=
radius-
TREASURE_SEARCH_BOUNDARY_BUFFER_METERS;

const deadEndCandidates=[];


/* =========================
   点と線分の距離
========================= */

function pointToSegmentDistanceMeters(
p,
a,
b
){

const latRef=p.lat;

const mPerDegLat=111320;

const mPerDegLng=
111320*
Math.cos(
latRef*
Math.PI/
180
);

const toXY=
pt=>({

x:
(pt.lng-p.lng)*
mPerDegLng,

y:
(pt.lat-p.lat)*
mPerDegLat

});

const A=toXY(a);
const B=toXY(b);

const ABx=
B.x-A.x;

const ABy=
B.y-A.y;

const lenSq=
ABx*ABx+
ABy*ABy;

let t=
lenSq===0
?0
:(
(-A.x)*ABx+
(-A.y)*ABy
)/
lenSq;

t=
Math.max(
0,
Math.min(
1,
t
)
);

const closestX=
A.x+
ABx*t;

const closestY=
A.y+
ABy*t;

return Math.hypot(
closestX,
closestY
);

}


function isNearOtherWaySegment(
candidate,
ownClusterId
){

for(
const way
of ways
){

for(
let i=0;
i<way.length-1;
i++
){

const aId=
way[i];

const bId=
way[i+1];

const aCluster=
nodeToCluster[aId];

const bCluster=
nodeToCluster[bId];

if(
aCluster===ownClusterId||
bCluster===ownClusterId
){

continue;

}

const a=
nodes[aId];

const b=
nodes[bId];

if(!a||!b)continue;

if(
pointToSegmentDistanceMeters(
candidate,
a,
b
)<=
NEAR_OTHER_WAY_METERS
){

return true;

}

}

}

return false;

}


/* =========================
   行き止まり候補
========================= */

clusterList.forEach(
(
cluster,
clusterId
)=>{

const neighbors=
clusterAdjacency[
clusterId
];

if(
neighbors.size!==1
){

return;

}

const distanceFromSearchCenter=
calculateDistance(
lat,
lng,
cluster.lat,
cluster.lng
);

if(
distanceFromSearchCenter>
searchRadius
){

return;

}

const neighborId=
[
...neighbors
][0];

const neighbor=
clusterList[
neighborId
];

let bestNode={
...cluster
};

let bestDistance=-1;

for(
const memberId
of cluster.members
){

const node=
nodes[memberId];

const d=
calculateDistance(
node.lat,
node.lng,
neighbor.lat,
neighbor.lng
);

if(
d>bestDistance
){

bestDistance=d;
bestNode=node;

}

}

if(
isNearOtherWaySegment(
bestNode,
clusterId
)
){

return;

}

deadEndCandidates.push({

id:
`cluster_${clusterId}`,

lat:
bestNode.lat,

lng:
bestNode.lng

});

}
);


/* =========================
   重複除去
========================= */

const uniqueDeadEnds=[];

for(
const candidate
of deadEndCandidates
){

if(
!uniqueDeadEnds.some(
c=>
calculateDistance(
c.lat,
c.lng,
candidate.lat,
candidate.lng
)<15
)
){

uniqueDeadEnds.push(
candidate
);

}

}


/*
 * 一度発見した宝箱は削除しない。
 *
 * OSMデータの取得結果が検索ごとに
 * 少し変化しても、発見済みの宝箱は
 * 永続的に残す。
 */

treasureList=
treasureList.filter(
t=>
t&&
typeof t.lat==='number'&&
typeof t.lng==='number'&&
Number.isFinite(t.lat)&&
Number.isFinite(t.lng)
);

let newAddedCount=0;

for(
const candidate
of uniqueDeadEnds
){

const exists=
treasureList.some(
t=>
calculateDistance(
t.lat,
t.lng,
candidate.lat,
candidate.lng
)<15
);

if(!exists){

treasureList.push({

id:
createTreasureId(
candidate.lat,
candidate.lng
),

lat:
candidate.lat,

lng:
candidate.lng,

opened:false

});

newAddedCount++;

}

}

localStorage.setItem(
STORAGE_KEY_TREASURES,
JSON.stringify(
treasureList
)
);

localStorage.setItem(
'fog_treasure_algorithm_version',
TREASURE_ALGORITHM_VERSION
);

if(
newAddedCount>0
){

showNotification(
`🎁 宝箱を ${newAddedCount} 個発見！`
);

}else if(
uniqueDeadEnds.length===0
){

showNotification(
'🔍 この周辺に宝箱は見つかりませんでした'
);

}else{

showNotification(
`🔍 宝箱を ${uniqueDeadEnds.length} 箇所確認しました`
);

}

renderTreasures();

}catch(err){

console.error(
'解析エラー:',
err
);

showNotification(
'⚠️ 宝箱の解析に失敗したため、今回は追加しませんでした'
);

}finally{

isFetchingTreasures=false;

}

}


/* =========================
   宝箱を開く
========================= */

function tryOpenTreasure(
treasureId
){

const treasure=
treasureList.find(
t=>t.id===treasureId
);

if(
!treasure||
treasure.opened
){

return;

}

if(
!currentLatLng||
!Number.isFinite(currentAccuracy)||
!currentPositionTimestamp
){

showNotification(
'📍 現在地を取得中です。少し待ってからもう一度タップしてください'
);

return;

}

const positionAge=
Date.now()-
currentPositionTimestamp;

if(
positionAge>
TREASURE_TAP_POSITION_MAX_AGE_MS
){

showNotification(
'📍 現在地の情報が古くなっています。少し待ってからもう一度タップしてください'
);

return;

}

if(
currentAccuracy>
TREASURE_TAP_MAX_ACCURACY_METERS
){

showNotification(
`📍 GPS精度が低いため開けません（現在 ±${Math.round(
currentAccuracy
)}m）`
);

return;

}

const dist=
calculateDistance(
currentLatLng[0],
currentLatLng[1],
treasure.lat,
treasure.lng
);

const safeDistance=
dist+
currentAccuracy;

if(
safeDistance>
TREASURE_GET_RADIUS_METERS
){

showNotification(
`🎁 宝箱に近づいてください（約${Math.round(
dist
)}m）`
);

return;

}

treasure.opened=true;

openedTreasureCount+=1;

gemCount+=1;

localStorage.setItem(
STORAGE_KEY_TREASURES,
JSON.stringify(treasureList)
);

localStorage.setItem(
STORAGE_KEY_OPENED_TREASURES,
String(openedTreasureCount)
);

localStorage.setItem(
STORAGE_KEY_GEMS,
String(gemCount)
);

localStorage.setItem(
'fog_treasure_algorithm_version',
TREASURE_ALGORITHM_VERSION
);

showNotification(
'🎁 宝箱を開けました！ 💎 ジェムを1個獲得！'
);

renderTreasures();

}


function showNotification(msg){

const notif=
document.getElementById(
'notification'
);

notif.innerText=msg;

notif.style.display='block';

setTimeout(
()=>{
notif.style.display='none';
},
3500
);

}


renderTreasures();


/* =========================
   宝箱検索ボタン
========================= */

document
.getElementById(
'reload-treasure-btn'
)
.addEventListener(
'click',
()=>{

if(currentLatLng){

lastFetchedLatLng={
lat:currentLatLng[0],
lng:currentLatLng[1]
};

fetchDeadEndTreasures(
currentLatLng[0],
currentLatLng[1]
);

}else{

alert(
"GPSで現在地を取得するまでお待ちください。"
);

}

}
);


/* =========================
   Wake Lock
========================= */

const wakelockToggle=
document.getElementById(
'wakelock-toggle'
);

const wakelockBadge=
document.getElementById(
'wakelock-badge'
);

async function requestWakeLock(){

if('wakeLock' in navigator){

try{

wakeLock=
await navigator.wakeLock.request(
'screen'
);

wakelockBadge.innerText=
'ON';

wakelockBadge.className=
'wakelock-status status-on';

wakelockToggle.checked=
true;

wakeLock.addEventListener(
'release',
()=>{

wakeLock=null;

wakelockBadge.innerText=
'OFF';

wakelockBadge.className=
'wakelock-status status-off';

wakelockToggle.checked=
false;

}
);

}catch(err){

wakelockBadge.innerText=
'エラー';

wakelockBadge.className=
'wakelock-status status-off';

wakelockToggle.checked=
false;

}

}else{

wakelockBadge.innerText=
'非対応';

wakelockBadge.className=
'wakelock-status status-off';

wakelockToggle.checked=
false;

}

}

function releaseWakeLock(){

if(wakeLock!==null){

wakeLock.release();

wakeLock=null;

}

wakelockBadge.innerText=
'OFF';

wakelockBadge.className=
'wakelock-status status-off';

}

wakelockToggle.addEventListener(
'change',
e=>{

if(e.target.checked){

requestWakeLock();

}else{

releaseWakeLock();

}

}
);

document.addEventListener(
'visibilitychange',
async()=>{

if(
document.visibilityState==='visible'&&
wakelockToggle.checked
){

await requestWakeLock();

}

}
);


/* =========================
   霧の濃さ
========================= */

const opacitySlider=
document.getElementById(
'opacity-slider'
);

const opacityVal=
document.getElementById(
'opacity-val'
);

opacitySlider.addEventListener(
'input',
e=>{

const value=
e.target.value;

opacityVal.innerText=
`${value}%`;

fogOpacity=
value/100;

localStorage.setItem(
STORAGE_KEY_OPACITY,
value
);

requestDrawFog();

}
);


/* =========================
   距離計算
========================= */

function calculateDistance(
lat1,
lon1,
lat2,
lon2
){

const R=6371000;

const dLat=
(lat2-lat1)*
Math.PI/
180;

const dLon=
(lon2-lon1)*
Math.PI/
180;

const a=
Math.sin(dLat/2)*
Math.sin(dLat/2)+
Math.cos(
lat1*
Math.PI/
180
)*
Math.cos(
lat2*
Math.PI/
180
)*
Math.sin(dLon/2)*
Math.sin(dLon/2);

return R*2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}


/* =========================
   GPS
========================= */

function startGeolocation(
highAccuracy=true
){

if(
!("geolocation" in navigator)
){

document.getElementById(
"status"
).innerText=
"GPS非対応ブラウザです";

return;

}

if(
watchId!==null
){

navigator.geolocation.clearWatch(
watchId
);

}

const options={
enableHighAccuracy:highAccuracy,
timeout:
highAccuracy?15000:30000,
maximumAge:3000
};

watchId=
navigator.geolocation.watchPosition(

position=>{

const lat=
position.coords.latitude;

const lng=
position.coords.longitude;

const accuracy=
position.coords.accuracy;

currentLatLng=
[
lat,
lng
];

currentAccuracy=
accuracy;

currentPositionTimestamp=
Date.now();

if(
visitedPoints.length===0&&
!userMarker
){

map.setView(
currentLatLng,
17
);

}

if(
!lastFetchedLatLng||
calculateDistance(
lastFetchedLatLng.lat,
lastFetchedLatLng.lng,
lat,
lng
)>=
REFETCH_TREASURE_DISTANCE
){

lastFetchedLatLng={
lat,
lng
};

fetchDeadEndTreasures(
lat,
lng
);

}

if(
accuracy<=150
){

let shouldAdd=false;

if(
visitedPoints.length===0
){

shouldAdd=true;

}else{

const lastPoint=
visitedPoints[
visitedPoints.length-1
];

const dist=
calculateDistance(
lastPoint.lat,
lastPoint.lng,
lat,
lng
);

if(
dist>=
MIN_RECORD_DISTANCE_METERS
){

shouldAdd=true;

}

}

if(shouldAdd){

visitedPoints.push({

lat:lat,
lng:lng,
radius:
UNFOG_RADIUS_METERS

});

localStorage.setItem(
STORAGE_KEY_POINTS,
JSON.stringify(
visitedPoints
)
);

requestDrawFog();

}

}

updateUserMarker();

document.getElementById(
"status"
).innerText=
`開拓: ${visitedPoints.length}pt (精度:±${Math.round(
accuracy
)}m)`;

},

error=>{

console.warn(
"GPSエラー:",
error
);

let errMsg=
"GPSエラー";

switch(error.code){

case error.PERMISSION_DENIED:

errMsg=
"⚠️ 位置情報が「拒否」されています。";

break;

case error.POSITION_UNAVAILABLE:

errMsg=
"位置情報を取得できません";

break;

case error.TIMEOUT:

if(highAccuracy){

document.getElementById(
"status"
).innerText=
"高精度測位タイムアウト。標準精度で試行中...";

startGeolocation(false);

return;

}

errMsg=
"GPSタイムアウト。屋外でお試しください。";

break;

}

document.getElementById(
"status"
).innerText=
errMsg;

},

options

);

}

startGeolocation(true);


/* =========================
   現在地へ移動
========================= */

document
.getElementById(
'locate-btn'
)
.addEventListener(
'click',
()=>{

if(currentLatLng){

map.flyTo(
currentLatLng,
17,
{
duration:1.2
}
);

}else{

alert(
"現在地を取得中です。少し待ってからお試しください。"
);

}

}
);


/* =========================
   Cache
========================= */

if(
'serviceWorker' in navigator
){

navigator.serviceWorker
.getRegistrations()
.then(
registrations=>{

for(
let registration
of registrations
){

registration.unregister();

}

}
);

}

if('caches' in window){

caches.keys()
.then(
names=>{

for(
let name
of names
){

caches.delete(name);

}

}
);

}

</script>
